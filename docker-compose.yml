# WakeHub v0.3.1 — server + local agent（host 网络）
#
# 用法：先跑 `bash install.sh` 生成 .env（随机密钥 + 显式网段），再
# `docker compose up -d`。不要跳过 install.sh 直接 up：三个密钥类变量
# 未设置时 compose 会直接报错退出，服务端也不会以占位值启动（契约 §2.7）。
#
# v0.3.0 起另有单容器模式（一条 docker run，不用 compose，见 README
# “快速启动”）；本 compose 文件保留给多 Agent / 多网段与老部署升级。
# 注意：镜像默认入口已是单容器 entrypoint（同时跑 Server+Agent），
# 故 server 服务须显式覆盖 entrypoint 只跑 server（见下）。
# v0.3.1 起镜像默认以 root 启动（单容器入口修 bind mount 属主用），
# compose 的两个服务须显式加 user: "10001:10001"，继续以 wakehub
# 身份跑（与 v0.3.0 的行为一致，不经过入口的 root 阶段）。
#
# 数据在命名卷里：Server 用 wakehub_data（数据库 + 审计 + SSH 密文），
# Local Agent 用独立的 wakehub_agent_data（仅 agent-token 文件）。
# v0.2.9 问题 1：两卷分离后 Agent 触不到数据库文件；从旧版升级须先跑
# scripts/migrate-agent-volume.sh 把 Token 复制到新卷，再 up（见
# docs/MIGRATION-v0.2.9.md）。`docker compose down -v` 会删库删 token，
# 执行前先备份（scripts/backup.sh）。
# 多架构：镜像本身是多架构的（见 Dockerfile）；arm64 机器上直接 build 即可，
# 或用 `docker buildx build --platform linux/amd64,linux/arm64` 预构建。

services:
  wakehub-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建源（v0.2.9 问题 17）：.env 里可覆盖，不写时用 Dockerfile 默认值。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: wakehub:0.3.1
    container_name: wakehub-server
    restart: unless-stopped
    # v0.3.1：镜像默认以 root 启动（单容器入口修数据卷属主用），
    # compose 服务显式跑成 wakehub(10001)，与 v0.3.0 行为一致。
    user: "10001:10001"
    # v0.3.0：镜像默认入口是单容器 entrypoint（同时跑 Server+Agent），
    # compose 的 server 服务只跑 server，须显式覆盖入口。
    entrypoint: ["/app/wakehub-server"]
    ports:
      # 绑定地址（v0.2.9 问题 18）：默认 0.0.0.0（监听全部网卡）。
      # 只在“仅本机访问”时才改 127.0.0.1；从另一台机器访问时（如经
      # Cloudflare 隧道连本机 IP）改回环会直接断连，勿改。
      - "${WAKEHUB_BIND_ADDRESS:-0.0.0.0}:${WAKEHUB_PORT:-8080}:8080"
    environment:
      - WAKEHUB_LISTEN_ADDR=:8080
      - WAKEHUB_DB_PATH=/app/data/wakehub.db
      - WAKEHUB_MIGRATIONS_PATH=/app/migrations/001_init.sql
      - WAKEHUB_WEB_DIST=/app/web/dist
      - WAKEHUB_ADMIN_USER=${WAKEHUB_ADMIN_USER:-admin}
      # 以下三项无默认值：未设置时 compose 直接报错，不以占位值静默启动。
      - WAKEHUB_ADMIN_PASSWORD=${WAKEHUB_ADMIN_PASSWORD:?WAKEHUB_ADMIN_PASSWORD 未设置，请先跑 bash install.sh}
      - WAKEHUB_SECRET_KEY=${WAKEHUB_SECRET_KEY:?WAKEHUB_SECRET_KEY 未设置，请先跑 bash install.sh}
      - WAKEHUB_AGENT_ENROLL_TOKEN=${WAKEHUB_AGENT_ENROLL_TOKEN:?WAKEHUB_AGENT_ENROLL_TOKEN 未设置，请先跑 bash install.sh}
      - WAKEHUB_TRUSTED_PROXIES=${WAKEHUB_TRUSTED_PROXIES:-}
      - WAKEHUB_WS_ALLOWED_ORIGINS=${WAKEHUB_WS_ALLOWED_ORIGINS:-}
      - WAKEHUB_COOKIE_SECURE=${WAKEHUB_COOKIE_SECURE:-0}
      - WAKEHUB_WOL_RETRIES=${WAKEHUB_WOL_RETRIES:-3}
      # 服务端任务等待上限（v0.2.9 问题 6）：默认 15s，比 Agent 执行上限
      # 默认 10s 多 5s，给回包留余量；改动时保持“服务端 > Agent”。
      - WAKEHUB_SERVER_TASK_TIMEOUT=${WAKEHUB_SERVER_TASK_TIMEOUT:-15s}
    volumes:
      - wakehub_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # 最小权限：server 不发 ICMP、不绑低端口，全部能力都可收掉。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  wakehub-agent-local:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: wakehub:0.3.1
    container_name: wakehub-agent-local
    restart: unless-stopped
    # v0.3.1：镜像默认以 root 启动，compose 服务显式跑成 wakehub(10001)，
    # 与 v0.3.0 行为一致（Agent 卷本就是 wakehub 属主）。
    user: "10001:10001"
    # host 网络：WOL 魔术包是二层广播，必须与目标设备在同一广播域。
    network_mode: host
    entrypoint: ["/app/wakehub-agent"]
    environment:
      - WAKEHUB_SERVER_WS_URL=${WAKEHUB_SERVER_WS_URL:-ws://127.0.0.1:8080/api/v1/ws/agent}
      - WAKEHUB_AGENT_ID=${WAKEHUB_AGENT_ID:?WAKEHUB_AGENT_ID 未设置，请先跑 bash install.sh}
      - WAKEHUB_AGENT_NAME=${WAKEHUB_AGENT_NAME:?WAKEHUB_AGENT_NAME 未设置，请先跑 bash install.sh}
      # Agent 侧 token：首次注册时填入网 token（与服务端
      # WAKEHUB_AGENT_ENROLL_TOKEN 相同的值）；获批后 Agent 自动改用
      # token 文件里的 per-agent token，该变量即失效。服务端 v0.2.0
      # 不再读取 WAKEHUB_AGENT_TOKEN（见 .env.example 与 security.md）。
      - WAKEHUB_AGENT_TOKEN=${WAKEHUB_AGENT_TOKEN:?WAKEHUB_AGENT_TOKEN 未设置，请先跑 bash install.sh}
      - WAKEHUB_AGENT_SUBNET=${WAKEHUB_AGENT_SUBNET:?WAKEHUB_AGENT_SUBNET 未设置（须与本机所在局域网一致，如 192.168.1.0/24），请先跑 bash install.sh}
      # 获批后下发的 per-agent token 持久化到独立数据卷，容器重启后不重入网。
      # v0.2.9：Agent 只挂 wakehub_agent_data，不再共用 Server 的 wakehub_data。
      - WAKEHUB_AGENT_TOKEN_FILE=/app/data/agent-token
      - WAKEHUB_AGENT_TLS_SKIP_VERIFY=${WAKEHUB_AGENT_TLS_SKIP_VERIFY:-0}
      # 明文 ws 开关（v0.2.9 问题 3）：默认 0，非回环地址一律要求 wss://；
      # 设为 1 才允许明文 ws:// 连局域网/公网 Server（token 明文传输）。
      - WAKEHUB_AGENT_ALLOW_INSECURE_WS=${WAKEHUB_AGENT_ALLOW_INSECURE_WS:-0}
      # Agent 任务执行上限（v0.2.9 问题 6）：默认 10s；服务端等待上限
      # 默认 15s，比它多 5s，给回包留余量。
      - WAKEHUB_AGENT_TASK_TIMEOUT=${WAKEHUB_AGENT_TASK_TIMEOUT:-10s}
    volumes:
      - wakehub_agent_data:/app/data
    # ping 检测需发 ICMP（D-N1）。v0.2.0 的 local 节点已退役，ping 在
    # Agent 侧执行，所以能力加在 agent 上，而不是 server 上。
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    # 注意：agent 上不能开 no-new-privileges（V-N1 实测教训）。
    # /bin/ping 的文件能力 cap_net_raw+ep（Dockerfile 里 setcap）靠
    # exec 时授予，而 no-new-privileges 会让内核忽略文件能力，导致
    # Agent 内 ping 始终 EPERM；docker exec 不套用该选项，所以拿
    # docker exec 测 ping 会误判为"已修好"。server 不发 ICMP，保留。
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      wakehub-server:
        condition: service_healthy

volumes:
  wakehub_data:
  wakehub_agent_data:
