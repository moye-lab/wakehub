# WakeHub — 打 v* tag 自动构建多架构镜像并推送到 Docker Hub。
#
# 触发：git tag v0.3.2 && git push origin v0.3.2（或在 Actions 页手动触发）。
# 产物：moyelab/wakehub:<版本>、moyelab/wakehub:<主.次>、moyelab/wakehub:latest，
# 均为 linux/amd64 + linux/arm64 双架构。
#
# 仓库需先配两个 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME — Docker Hub 用户名（moyelab）
#   DOCKERHUB_TOKEN    — Docker Hub 访问令牌（长期 PAT，只读推送权限即可）
# 构建本身不需要任何密钥（npm / Go 依赖源由 Dockerfile 的 ARG 默认值提供）。

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: moyelab/wakehub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
